apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: pulso-bluegreen
  namespace: pulso-bluegreen
  labels:
    app: pulso-bluegreen
spec:
  replicas: 2
  revisionHistoryLimit: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: pulso-bluegreen
  template:
    metadata:
      labels:
        app: pulso-bluegreen
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pulso
          image: ghcr.io/felipef2s/pulso:SUBSTITUA_PELO_SHA
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
  strategy:
    blueGreen:
      activeService: pulso-active
      previewService: pulso-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
