apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pulso-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/felipef2s/pulso-config.git
    targetRevision: main
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true       # o que sai do Git sai do cluster (cuidado: apaga de verdade)
      selfHeal: true    # mudança feita na mão não sobrevive