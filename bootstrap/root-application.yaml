apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pulso-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/felipef2s/pulso-config.git
    targetRevision: main
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: false
