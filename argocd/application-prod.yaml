# AULA 5.2 — uma Application por ambiente.
# prod: sync MANUAL. Uma pessoa decide quando a versão entra.
# Os dois caminhos são GitOps: a diferença é só onde fica o clique humano.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pulso-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/felipef2s/pulso-config.git
    targetRevision: main
    path: envs/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: pulso-prod
  syncPolicy: {}
