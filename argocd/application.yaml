
# Aplique com:  kubectl apply -n argocd -f argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pulso
  namespace: argocd            # a Application mora aqui
spec:
  project: default

  source:                      # DE ONDE
    repoURL: https://github.com/felipef2s/pulso-config.git
    targetRevision: main
    path: k8s

  destination:                 # PARA ONDE
    server: https://kubernetes.default.svc
    namespace: pulso

  syncPolicy:
    automated:
      prune: true       # o que sai do Git sai do cluster (cuidado: apaga de verdade)
      selfHeal: true    # mudança feita na mão não sobrevive
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
