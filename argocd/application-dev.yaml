# AULA 5.2 — uma Application por ambiente.
# dev: auto-sync ligado, deploy assim que a tag muda.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pulso-dev
  namespace: argocd
spec:
  project: pulso
  source:
    repoURL: https://github.com/felipef2s/pulso-config.git
    targetRevision: main
    path: envs/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: pulso-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
